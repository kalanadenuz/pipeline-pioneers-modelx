[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hydropulse"
version = "1.0.0"
description = "Physics-Informed Satellite Catchment Early-Warning Flood Engine"
authors = [
    {name = "Kalana Kuruppu", email = "kalanadenuz2002@gmail.com"},
    {name = "Theekshana Chandrathunga", email = "stumayangi22@gmail.com"}
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "requests>=2.28.0",
    "pydantic>=1.10.0",
    "fastapi>=0.90.0",
    "uvicorn>=0.17.0",
    "pyarrow>=10.0.0",
    "matplotlib>=3.7.0",
    "streamlit>=1.30.0",
]
